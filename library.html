<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/library.css" />
    <title>GameForge - My Library</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header>
      <a href="index.html" class="nav-left">
        <img src="Asset/Icon/Logo.png" alt="Logo" style="height: 22px; width: 17px" />
        <span class="site-name">GameForge</span>
      </a>
      <div class="nav-center">
        <div class="indicators">
          <a href="index.html">Home</a>
          <a href="browse.html">Browse</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="library.html" class="active">Library</a>
        </div>
        <div class="search-box">
          <img src="Asset/Icon/Search.png" alt="Search" class="search-icon" />
          <input type="text" placeholder="Search for games..." />
        </div>
      </div>
      <div class="nav-right">
        <a href="cart.html"><img src="Asset/Icon/Shopping Cart.png" alt="Cart" style="height: 17px" /></a>
        <a href="profile.html">
          <img src="Asset/Icon/Profile Picture.png" alt="Profile" style="height: 29px; border-radius: 50%; margin-top: -8px" />
        </a>
      </div>
    </header>

    <main class="library-container">
      <div class="library-title-group">
        <div class="yellow-box">
            <img src="Asset/Icon/Star2.png" alt="" style="width: 16px;">
        </div>
        <h1>My Library</h1>
      </div>

      <div class="library-list">
        <div class="library-card">
          <img src="Asset/Image/katana-runner.jpg" alt="Katana Runner 2049" />
          <div class="card-content">
            <div class="new-tag">
              <span class="dot"></span>
              <span class="text">new</span>
            </div>
            <h2 class="game-title">Katana Runner 2049</h2>
          </div>
        </div>

        <div class="library-card">
          <img src="Asset/Image/cs2.jpg" alt="Counter-Straight 2" />
          <div class="card-content">
            <h2 class="game-title">Counter-Straight 2</h2>
          </div>
        </div>

        <div class="library-card">
          <img src="Asset/Image/devil-may-smile.jpg" alt="Devil May Smile V" />
          <div class="card-content">
            <h2 class="game-title">Devil May Smile V</h2>
          </div>
        </div>

        <div class="library-card">
          <img src="Asset/Image/blue-dead.jpg" alt="Blue Dead Redemption 2" />
          <div class="card-content">
            <h2 class="game-title">Blue Dead Redemption 2</h2>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-web">
        <img src="Asset/Icon/Logo.png" alt="Logo" style="height: 22px; width: 17px" />
        <span class="site-name">GameForge</span>
      </div>
    </footer>
  </body>
</html>
