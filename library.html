<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/library.css">
    <title>GameForge - My Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="nav-left">
            <img src="Asset/Icon/Logo.png" alt="Logo" style="height: 22px; width: 17px">
            <span class="site-name">GameForge</span>
        </a>
        <div class="nav-center">
            <div class="indicators">
                <a href="index.html">Home</a>
                <a href="browse.html">Browse</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="library.html" class="active">Library</a>
            </div>
            <div class="search-box">
                <img src="Asset/Icon/Search.png" alt="Search" class="search-icon">
                <input type="text" placeholder="Search for games...">
            </div>
        </div>
        <div class="nav-right">
            <a href="cart.html"><img src="Asset/Icon/Shopping Cart.png" alt="Cart" style="height: 17px"></a>
            <a href="profile.html">
                <img src="Asset/Icon/Profile Picture.png" alt="Profile" style="height: 29px; border-radius: 50%; margin-top: -8px">
            </a>
        </div>
    </header>

    <main class="library-main">
        <aside class="sidebar">
            <div class="library-header">
                <div class="yellow-diamond"></div>
                <h1>My Library</h1>
            </div>

            <div class="game-list-vertical">
                <div class="lib-card" onclick="updateDisplay('Katana Runner 2049', 'Asset/Image/katana-runner-bg.jpg', this)">
                    <img src="Asset/Image/katana-runner.jpg" alt="Katana Runner">
                    <div class="card-title">Katana Runner 2049</div>
                </div>

                <div class="lib-card" onclick="updateDisplay('Counter-Straight 2', 'Asset/Image/cs2-bg.jpg', this)">
                    <img src="Asset/Image/cs2.jpg" alt="CS2">
                    <div class="card-title">Counter-Straight 2</div>
                </div>

                <div class="lib-card" onclick="updateDisplay('Devil May Smile V', 'Asset/Image/dms-bg.jpg', this)">
                    <img src="Asset/Image/devil-may-smile.jpg" alt="DMS">
                    <div class="card-title">Devil May Smile V</div>
                </div>

                <div class="lib-card" onclick="updateDisplay('Blue Dead Redemption 2', 'Asset/Image/blue-dead-bg.jpg', this)">
                    <img src="Asset/Image/blue-dead.jpg" alt="BDR">
                    <div class="card-title">Blue Dead Redemption 2</div>
                </div>
            </div>
        </aside>

        <section class="display-area hidden" id="displayArea">
            <div class="image-wrapper">
                <img id="main-bg" src="" alt="Background">
                <div class="white-gradient-left"></div>
                <div class="black-gradient-bottom"></div>
                <h1 id="main-title"></h1>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-web">
            <img src="Asset/Icon/Logo.png" alt="Logo" style="height: 22px; width: 17px">
            <span class="site-name">GameForge</span>
        </div>
    </footer>

    <script>
        function updateDisplay(title, imgSrc, element) {
            const displayArea = document.getElementById('displayArea');
            // Hiển thị vùng nội dung bên phải
            displayArea.classList.remove('hidden');

            // Cập nhật thông tin game
            document.getElementById('main-title').innerText = title;
            document.getElementById('main-bg').src = imgSrc;

            // Xử lý trạng thái card được chọn
            const cards = document.querySelectorAll('.lib-card');
            cards.forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
